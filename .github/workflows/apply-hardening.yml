name: Apply approved audit hardening

on:
  push:
    branches: [audit-hardening-v1.0.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit-hardening-v1.0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Reconstruct hardening script
        shell: bash
        run: |
          cat .github/hardening-payload/chunk* > /tmp/apply_audit_hardening.py.xz.b64
          base64 --decode /tmp/apply_audit_hardening.py.xz.b64 > /tmp/apply_audit_hardening.py.xz
          xz --decompress --stdout /tmp/apply_audit_hardening.py.xz > scripts/apply_audit_hardening.py
          python -m py_compile scripts/apply_audit_hardening.py

      - name: Apply approved changes
        run: python scripts/apply_audit_hardening.py

      - name: Diagnose generated Python sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failures = []
          for path in sorted(Path('.').rglob('*.py')):
              data = path.read_bytes()
              positions = [index for index, value in enumerate(data) if value == 0]
              if positions:
                  failures.append((path, positions[:20]))
          if failures:
              for path, positions in failures:
                  print(f'embedded NUL bytes: {path}: {positions}')
              sys.exit(1)
          print('No embedded NUL bytes found.')
          PY

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skill packages
        run: python scripts/validate_skills.py

      - name: Validate catalog and routing
        run: python scripts/validate_catalog.py

      - name: Test collection validator
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Test Brownfield Steward
        run: python -m unittest discover -s skills/steward-brownfield/tests -p 'test_*.py'

      - name: Commit hardened repository
        shell: bash
        run: |
          rm -rf .github/hardening-payload .github/workflows/apply-hardening.yml
          rm -f scripts/apply_audit_hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden skills and Brownfield runtime'
          git push origin HEAD:audit-hardening-v1.0.1
