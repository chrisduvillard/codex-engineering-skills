name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skills:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skill packages
        run: python scripts/validate_skills.py

      - name: Validate catalog and routing
        run: python scripts/validate_catalog.py

      - name: Test collection validator
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Test Brownfield Steward
        run: python -m unittest discover -s skills/steward-brownfield/tests -p 'test_*.py'
