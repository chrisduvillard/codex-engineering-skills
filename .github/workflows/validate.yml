name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    name: Skills and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate skill packages
        run: python scripts/validate_skills.py

      - name: Test Brownfield Steward
        run: python -m unittest discover -s skills/steward-brownfield/tests -p 'test_*.py'
